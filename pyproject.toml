[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balancepy"
version = "0.1.1"
authors = [
  { name="Lorenz Assländer", email="lorenz.asslaender@uni-konstanz.de" },
  { name="Matthias Albrecht", email="matthias.albrecht@uni-konstanz.de" },
]
description = "Human balance analysis using Python"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "plotly",
  "kaleido",
  "openpyxl",
  "scikit-rf",
  "statsmodels",
  "joblib",
  "scikits-bootstrap",
  "control>=0.10.2,<0.11.0"
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.2.3",
  "sphinx-rtd-theme>=3.0.2",
  "sphinx-autodoc-typehints>=3.2.0",
  "myst-parser>=4.0.1",
  "myst-nb>=1.2.0"
]

[project.urls]
Homepage = "https://github.com/PostureControlLab/balancepy"
Repository = "https://github.com/PostureControlLab/balancepy"
Documentation = "https://posturecontrollab.github.io/balancepy/"
Issues = "https://github.com/PostureControlLab/balancepy/issues"
