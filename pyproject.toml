[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balancepy"
version = "0.1.1"
authors = [
  { name="Lorenz Assländer", email="lorenz.asslaender@uni-konstanz.de" },
  { name="Matthias Albrecht", email="matthias.albrecht@uni-konstanz.de" },
]
description = "Human balance analysis using Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["biomechanics", "human balance", "postural control", "systems identification", "virtual reality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "plotly",
  "openpyxl",
  "scikit-rf",
  "statsmodels",
  "joblib",
  "scikits-bootstrap",
  "control>=0.10.2,<0.11.0",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel",
  "nbformat",
  "ipywidgets",
]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "sphinx>=8.0",
  "sphinx-rtd-theme>=3.0",
  "sphinx-autodoc-typehints>=3.0",
  "myst-parser>=4.0",
  "myst-nb>=1.0",
]




[project.urls]
Homepage = "https://github.com/PostureControlLab/balancepy"
Repository = "https://github.com/PostureControlLab/balancepy"
Documentation = "https://posturecontrollab.github.io/balancepy/"
Issues = "https://github.com/PostureControlLab/balancepy/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/balancepy"

[tool.coverage.run]
source = ["src/balancepy"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.sdist]
only-packages = false
include = [
  "src/",
  "tests/",
  "docs/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "MANIFEST.in",
  "pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  ".git",
  ".gitignore",
  ".github",
  ".python-version",
  ".vscode",
  ".idea",
  "poetry.lock",
  "Makefile",
]

